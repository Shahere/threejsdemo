<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DWorld</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="cursor" id="cursor"></div>
    <div class="main" id="homeView">
      <a class="github" href="https://github.com/Shahere" target="_blank"
        >@Shahere</a
      >
      <div class="colorPreset">
        <div class="bg-color">
          <ul class="colors">
            <li class="color" id="black">
              <div class="color_btn black"></div>
              <div class="border"></div>
            </li>
            <li class="color" id="blue">
              <div class="color_btn blue"></div>
              <div class="border"></div>
            </li>
            <li class="color" id="red">
              <div class="color_btn red"></div>
              <div class="border"></div>
            </li>
            <li class="color" id="grey">
              <div class="color_btn grey"></div>
              <div class="border"></div>
            </li>
          </ul>
        </div>
      </div>
      <h1 class="left">
        <div class="home">
          <div class="home_title">
            <div class="frfr">
              <div class="posleft">A collection of</div>
            </div>
            <div class="frfr">
              <div class="poscenter">web graphic experiments</div>
            </div>
            <div class="frfr posright">
              <div class="">By Savinien</div>
            </div>
            <div class="about">
              <a id="aboutLink" class="no-deco">More info about this project</a>
            </div>
          </div>
        </div>
      </h1>
      <div class="right">
        <div class="container_right" id="scrollContainer">
          <div class="project_container">Voxels</div>
          <div class="project_container">2</div>
          <div class="project_container">3</div>
          <div class="project_container">4</div>
          <div class="project_container">5</div>
          <div class="project_container">6</div>
          <div class="project_container">7</div>
          <div class="project_container">8</div>
          <div class="project_container">9</div>
          <div class="project_container">10</div>
          <div class="project_container">11</div>
        </div>
      </div>
    </div>

    <div class="hidden main" id="aboutView">
      <h2>À propos de ce projet</h2>
      <p>
        Ce site présente une collection d'expériences 3D créées par Savinien.
      </p>
      <a id="backHome" class="backHome"
        ><div class="container flexalign">
          <div class="arrow">&#8592;</div>
          <div class="text">Retour</div>
        </div>
      </a>
    </div>
  </body>
  <script type="module" src="./script.js"></script>
  <script type="module" src="./scroll_container.js"></script>
  <script type="module" src="./cursor.js"></script>
  <script type="module" src="./view.js"></script>
</html>
